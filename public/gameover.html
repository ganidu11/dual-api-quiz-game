<!DOCTYPE html>

<html>
<head>
<title>Game Over</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="neon-bg">

<div class="gameover-box glass">

<h1 class="gameover-title">GAME OVER</h1>

<p>Your Score</p>

<h2 id="finalScore"></h2>

<button onclick="playAgain()">PLAY AGAIN</button>

</div>

<audio id="gameOverSound" src="sounds/gameover.mp3"></audio>

<script>

// SHOW SCORE
const score = localStorage.getItem("score");
document.getElementById("finalScore").innerText = score;

// 🔊 PLAY SOUND AFTER PAGE LOAD (CONTROLLED)
window.onload = function(){

    const shouldPlay = sessionStorage.getItem("playGameOverSound");

    if(shouldPlay === "true"){
        const sound = document.getElementById("gameOverSound");

        sound.currentTime = 0;
        sound.volume = 1;

        sound.play().catch(err=>{
            console.log("Sound blocked:", err);
        });

        // clear flag
        sessionStorage.removeItem("playGameOverSound");
    }
};

// SAVE SCORE
fetch("/game/score",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({score:score})
})
.then(res=>res.text())
.then(data=>{
console.log("Score saved:",data);
})
.catch(err=>{
console.log("Error saving score:",err);
});

// PLAY AGAIN
function playAgain(){
window.location.href="dashboard.html";
}

</script>


</body>
</html>
