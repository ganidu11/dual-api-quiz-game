<!DOCTYPE html>

<html>
<head>
<title>Leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="leaderboard-box glass">

<h1>Leaderboard</h1>

<table id="table"></table>

<button onclick="back()">Back</button>

</div>

<script>

fetch("/game/leaderboard")
.then(res=>res.json())
.then(data=>{

let t=document.getElementById("table");

data.forEach((p,i)=>{

let cls="";
if(i==0)cls="gold";
if(i==1)cls="silver";
if(i==2)cls="bronze";

t.innerHTML+=`
<tr class="${cls}">
<td>${i+1}</td>
<td>${p.username}</td>
<td>${p.score}</td>
</tr>
`;

});

});

function back(){
window.location="dashboard.html";
}

</script>

</body>
</html>
