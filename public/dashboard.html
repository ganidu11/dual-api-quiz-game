<!DOCTYPE html>

<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="center-screen">

<h1 class="title">QUIZZLE</h1>

<div>
<button onclick="start()">Start Game</button>
<button onclick="leader()">Leaderboard</button>
<button onclick="logout()">Logout</button>
</div>

</div>

<script>

function start(){ window.location="game.html"; }
function leader(){ window.location="leaderboard.html"; }

function logout(){
fetch("/auth/logout")
.then(()=>window.location="login.html");
}

</script>

</body>
</html>
